<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gundam Model Kit Stores UK</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <header>
    <h1>Gundam Kit Stores in the UK</h1>
  </header>

  <div class="controls">
    <div class="search-section">
      <input type="text" id="search-bar" placeholder="Search stores by name or location...">
    </div>
    
    <div class="filters-section">
      <h3>Filters</h3>
      <div class="filter-group">
        <label>Kit Types:</label>
        <div class="checkbox-group">
          <label><input type="checkbox" value="HG" checked> HG</label>
          <label><input type="checkbox" value="RG" checked> RG</label>
          <label><input type="checkbox" value="MG" checked> MG</label>
          <label><input type="checkbox" value="PG" checked> PG</label>
        </div>
      </div>
      
      <div class="filter-group">
        <label>Store Type:</label>
        <div class="checkbox-group">
          <label><input type="checkbox" value="inStore" checked> In-Store</label>
          <label><input type="checkbox" value="online" checked> Online</label>
        </div>
      </div>
      
      <div class="filter-group">
        <label>Rating:</label>
        <select id="rating-filter">
          <option value="">All Ratings</option>
          <option value="4.5">4.5+ Stars</option>
          <option value="4.0">4.0+ Stars</option>
          <option value="3.5">3.5+ Stars</option>
        </select>
      </div>
    </div>
  </div>

  <div class="main-content">
    <div class="map-section">
      <h3>Store Locations</h3>
      <div id="map"></div>
    </div>
    
    <div class="stores-section">
      <h3>Store List</h3>
      <div id="store-list"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
